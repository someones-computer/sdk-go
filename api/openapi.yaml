components:
  examples: {}
  headers: {}
  parameters: {}
  requestBodies: {}
  responses: {}
  schemas:
    Swarm.jsonMergePatch:
      description: |-
        A Docker Swarm we can deploy onto. The trust boundary of the platform.

        owner === null  => PLATFORM pool (shared infra we run).
        owner !== null  => CUSTOMER BYO cluster (untrusted, outbound-only).
      example:
        lastSeenAt: 2000-01-23T04:56:07.000+00:00
        platformOwned: true
        roles:
        - roles
        - roles
        publicHost: publicHost
        capacity:
          key: capacity
        ingressInstalledAt: 2000-01-23T04:56:07.000+00:00
        createdAt: 2000-01-23T04:56:07.000+00:00
        endpoint: endpoint
        id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        updatedAt: 2000-01-23T04:56:07.000+00:00
        owner: https://example.com/
        workingEdge: true
        kind: platform
        platformProvisioned: true
        ingressVerificationError: ingressVerificationError
        labels:
          key: labels
        deployments:
        - https://example.com/
        - https://example.com/
        deletedAt: 2000-01-23T04:56:07.000+00:00
        nodes:
        - createdAt: 2000-01-23T04:56:07.000+00:00
          hostname: hostname
          swarm: https://example.com/
          state: state
          id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          nodeId: nodeId
          capacity:
            key: capacity
          updatedAt: 2000-01-23T04:56:07.000+00:00
        - createdAt: 2000-01-23T04:56:07.000+00:00
          hostname: hostname
          swarm: https://example.com/
          state: state
          id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          nodeId: nodeId
          capacity:
            key: capacity
          updatedAt: 2000-01-23T04:56:07.000+00:00
        deleted: true
        ingressVerifiedAt: 2000-01-23T04:56:07.000+00:00
        ingressNetwork: ingressNetwork
        name: name
        ingressError: ingressError
        machines:
        - instance:
            lastSeenAt: 2000-01-23T04:56:07.000+00:00
            template: true
            lastError: lastError
            tokenId: tokenId
            templateBuiltAt: 2000-01-23T04:56:07.000+00:00
            verifyTls: true
            version:
              key: version
            templateAlpineVersion: templateAlpineVersion
            createdAt: 2000-01-23T04:56:07.000+00:00
            endpoint: endpoint
            name: name
            templateVmid: 2
            id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
            tokenSecret: tokenSecret
            publicKeyPin: publicKeyPin
            templateBuildStartedAt: 2000-01-23T04:56:07.000+00:00
            templateBuildFailures: 4
            status: unreachable
            updatedAt: 2000-01-23T04:56:07.000+00:00
          address: address
          provisioningStale: true
          vmid: 0
          diskGigabytes: 5
          diskBlocks: 6
          provisionAttempt: 5
          provisionStartedAt: 2000-01-23T04:56:07.000+00:00
          node: node
          createdAt: 2000-01-23T04:56:07.000+00:00
          size: s
          swarm: https://example.com/
          failure: failure
          organization: https://example.com/
          name: name
          templateVmid: 1
          state: requested
          id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          updatedAt: 2000-01-23T04:56:07.000+00:00
        - instance:
            lastSeenAt: 2000-01-23T04:56:07.000+00:00
            template: true
            lastError: lastError
            tokenId: tokenId
            templateBuiltAt: 2000-01-23T04:56:07.000+00:00
            verifyTls: true
            version:
              key: version
            templateAlpineVersion: templateAlpineVersion
            createdAt: 2000-01-23T04:56:07.000+00:00
            endpoint: endpoint
            name: name
            templateVmid: 2
            id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
            tokenSecret: tokenSecret
            publicKeyPin: publicKeyPin
            templateBuildStartedAt: 2000-01-23T04:56:07.000+00:00
            templateBuildFailures: 4
            status: unreachable
            updatedAt: 2000-01-23T04:56:07.000+00:00
          address: address
          provisioningStale: true
          vmid: 0
          diskGigabytes: 5
          diskBlocks: 6
          provisionAttempt: 5
          provisionStartedAt: 2000-01-23T04:56:07.000+00:00
          node: node
          createdAt: 2000-01-23T04:56:07.000+00:00
          size: s
          swarm: https://example.com/
          failure: failure
          organization: https://example.com/
          name: name
          templateVmid: 1
          state: requested
          id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          updatedAt: 2000-01-23T04:56:07.000+00:00
        status: unreachable
      properties:
        owner:
          description: Null for the platform pool; set for a customer BYO cluster.
          example: https://example.com/
          format: iri-reference
          nullable: true
          type: string
        kind:
          enum:
          - platform
          - customer
          readOnly: true
          type: string
        name:
          type: string
        endpoint:
          description: Manager API endpoint (tcp+TLS) or SSH target.
          type: string
        status:
          default: unreachable
          enum:
          - reachable
          - unreachable
          - draining
          type: string
        publicHost:
          description: |-
            The address a client *outside* the cluster reaches this context's published
            ports on — a hostname or an IP, no scheme and no port.
          nullable: true
          type: string
        roles:
          default:
          - runtime
          description: |-
            What this context is used for — builds, runtime, or both. Stored as the
            enum's string values rather than a relation: it is a small fixed set, and a
            json column needs no join to answer "where can I build?".
          items:
            type: string
          type: array
        lastSeenAt:
          format: date-time
          nullable: true
          type: string
        capacity:
          additionalProperties:
            nullable: true
            type: string
          description: |-
            Observed capacity snapshot (cpu/mem/nodes), reconciled from the swarm —
            whatever {@see \App\Service\Swarm\SwarmHealth::$capacity} carried at the
            last successful probe.
        labels:
          additionalProperties:
            type: string
          readOnly: true
        ingressInstalledAt:
          description: |-
            When {@see \App\Service\Ingress\TraefikInstaller} last stood up (or
            confirmed) the edge on this context, dispatched automatically once it
            becomes a platform-owned runtime context.
          format: date-time
          nullable: true
          readOnly: true
          type: string
        ingressError:
          description: |-
            What the last automatic install attempt said, when it failed. Cleared on
            a success so the row never shows a stale complaint next to a working edge.
          nullable: true
          readOnly: true
          type: string
        ingressNetwork:
          description: |-
            The shared overlay that install put the edge on — the one Traefik's
            `--providers.swarm.network` names, and therefore the only network a
            service can be routed from.
          nullable: true
          readOnly: true
          type: string
        ingressVerifiedAt:
          description: |-
            When the edge was last *observed* routing — the overlay present, the edge
            service on it, watching it, with a task running
            ({@see \App\Service\Ingress\IngressVerifier}).
          format: date-time
          nullable: true
          readOnly: true
          type: string
        ingressVerificationError:
          description: "What the last verification found wrong, or null when the edge\
            \ was routing."
          nullable: true
          readOnly: true
          type: string
        nodes:
          items:
            $ref: '#/components/schemas/SwarmNode'
          type: array
        machines:
          items:
            $ref: '#/components/schemas/Machine'
          type: array
        deployments:
          description: |-
            The revisions placed here. Mapped for the same single reason as
            {@see self::$machines} — so a delete can let go of them — rather than as
            a collection anything reads; {@see \App\Repository\DeploymentRepository}
            is where a caller asks what is on a context.
          items:
            example: https://example.com/
            format: iri-reference
            type: string
          type: array
        id:
          format: uuid
          readOnly: true
          type: string
        deletedAt:
          format: date-time
          nullable: true
          readOnly: true
          type: string
        createdAt:
          format: date-time
          readOnly: true
          type: string
        updatedAt:
          format: date-time
          nullable: true
          readOnly: true
          type: string
        platformOwned:
          readOnly: true
          type: boolean
        platformProvisioned:
          description: |-
            Whether the platform itself stood this context up, whoever currently
            owns the row — a machine {@see \App\MessageHandler\ProvisionMachineHandler}
            provisioned, running this platform's own trusted image, versus a
            customer's own cluster registered straight through
            {@see \App\Controller\Admin\SwarmController}.
          readOnly: true
          type: boolean
        workingEdge:
