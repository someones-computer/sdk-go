            every {@see self::reprovision()}. {@see \App\Entity\ProvisioningLogLine}
            tags each captured line with the value that was current when it was
            written, so a retry's transcript starts fresh rather than appending to
            the failed attempt before it.
          readOnly: true
          type: integer
        provisionStartedAt:
          description: |-
            When the current run through the flow began — set at construction and
            reset on every {@see self::reprovision()}, mirroring
            {@see ProxmoxInstance::$templateBuildStartedAt}. What
            {@see self::isProvisioningStale()} measures against: the real ceiling is
            the flow's own step deadlines ({@see \App\MessageHandler\ProvisionMachineHandler}'s
            `BOOT_DEADLINE`/`TASK_DEADLINE`), and a run still going past
            {@see self::PROVISION_PRESUMED_DEAD_AFTER} is a worker that died holding
            it — a crash, an OOM, a deploy restart — rather than one still working.
          format: date-time
          nullable: true
          readOnly: true
          type: string
        swarm:
          description: "The context this machine serves, if any. Nullable on purpose\
            \ — see the class docblock."
          example: https://example.com/
          format: iri-reference
          nullable: true
          type: string
        organization:
          description: |-
            The organization this machine was self-service-provisioned for, or null
            for one an operator made through `/admin/machines`. Nullable for the same
            reason `$swarm` is: an admin-made machine belongs to nobody's tenancy, and
            this column must not invent an owner for it. Set once, at creation, to the
            same organization that owns the paired `$swarm` — {@see Organization::markDeleted()}
            detaches it rather than deleting the row, matching how a BYO context's
            owner is handled.
          example: https://example.com/
          format: iri-reference
          nullable: true
          type: string
        id:
          format: uuid
          readOnly: true
          type: string
        createdAt:
          format: date-time
          readOnly: true
          type: string
        updatedAt:
          format: date-time
          nullable: true
          readOnly: true
          type: string
        diskGigabytes:
          readOnly: true
          type: integer
        provisioningStale:
          description: |-
            Still mid-flow, and has been for longer than any healthy run takes —
            what {@see \App\MessageHandler\SweepStaleMachineProvisionsHandler} sweeps
            for. A worker that crashed, OOM'd, or was recycled mid-step leaves the
            row exactly where it stood; nothing else ever revisits it, since the
            handler's own guard is "state is Requested" and every other step only
            ever moves the flow forward.
          readOnly: true
          type: boolean
