    CreditTransaction:
      description: |-
        An IMMUTABLE, append-only ledger row for an Organization's shared credit
        balance. A balance is never mutated in place — it's always
        `SUM(amountCents)` over `Succeeded` rows (see
        {@see CreditTransactionRepository::balanceForOrganization()}). Read-only over
        the API: money movement stays server-driven.

        Three kinds of row, one table ({@see CreditTransactionType}):

          - a **top-up** is created `Pending` before redirecting to Stripe Checkout,
            keyed on `stripeCheckoutSessionId`, then flipped to `Succeeded`/`Failed`
            by {@see \App\Controller\StripeWebhookController};
          - a **grant** and a **debit** are terminal the moment they are written, so
            both are written `Succeeded` — the `Pending` default is a Stripe-webhook
            state and is wrong for them — and neither has a Stripe session, which is
            why `stripeCheckoutSessionId` is nullable.

        A debit additionally carries the hour it bills for and the meter reading it
        came from, so the ledger can be checked against the usage events rather than
        taken on trust. One table rather than two because the balance has to be the
        sum of money in and money out, and a second table would make every balance
        read a join.
      example:
        engineMillis: 5
        type: top_up
        unresolvedContainers: 1
        stripeEventId: stripeEventId
        resourceKind: compute
        createdAt: 2000-01-23T04:56:07.000+00:00
        amountCents: 0
        createdBy:
          grantedRoles:
          - grantedRoles
          - grantedRoles
          emailConfirmed: true
          oauthIdentities:
          - createdAt: 2000-01-23T04:56:07.000+00:00
            provider: github
            id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
            providerUserId: providerUserId
            user: null
            updatedAt: 2000-01-23T04:56:07.000+00:00
