        serviceAdoption:
          default: "off"
          description: |-
            Whether a deploy's compose file is watched for services a managed
            equivalent could replace.
          enum:
          - "off"
          - auto
          type: string
        accessGate:
          default: none
          description: |-
            How this application's routed HTTP services are gated at the edge —
            `None` by default, so an application behaves exactly as it always has
            until an org manager opts it in ({@see AccessGateMode}).
          enum:
          - none
          - basic_auth
          - token
          - someones_auth
          type: string
        currentDeployment:
          description: Pointer to the currently active revision; null before the first
            deploy.
          example: https://example.com/
          format: iri-reference
          nullable: true
          type: string
        firstRunningAt:
          description: |-
            The first moment any revision of this application ever reached
            `running` — null until it has. What {@see \App\Service\Teardown\TeardownGracePeriod}
            measures grace-period uptime from, in place of the current revision's
            own `createdAt` (#1307): a revision row is stamped at bundle ingest and
            a fresh one is created on every `sc deploy`, so measuring off it gave a
            six-month-old production application a ten-minute grace period the
            moment it was redeployed. This is set once and never moved — a
            redeploy, or reactivating an old revision, does not reset it, because
            the application's history is what earns the longer grace, not whichever
            revision happens to be current.
          format: date-time
          nullable: true
          readOnly: true
          type: string
        primaryDeploymentName:
          description: |-
            Which deployment *name* owns the application's apex identity — the stack,
            network and hostname that carry no revision component
            ({@see \App\Service\Placement\StackNaming}).
          nullable: true
          type: string
        legacyStackBase:
          description: |-
            The `<prefix>-<org>-<app>` join this application's stacks were **already
            named from**, before the separator was made unambiguous — or null, meaning
            nothing of this application has ever been on a swarm under the old name and
            {@see \App\Service\Placement\StackNaming} is free to derive the current one.
          nullable: true
          type: string
        iconKey:
          description: |-
            Object key of this application's stored icon, or null when nobody has given
            it one — in which case {@see \App\Service\Icon\GeneratedIcon} draws one from
            the name and slug, so every application has an icon either way.
          nullable: true
          readOnly: true
          type: string
        iconSource:
          description: "Where {@see $iconKey} came from — null exactly when there\
            \ is no stored icon."
          enum:
          - uploaded
          - favicon
          - null
          nullable: true
          readOnly: true
          type: string
        buildBucket:
          description: |-
            This application's own Garage build-context bucket — where `sc deploy`'s
            uploaded contexts and forwarded images are parked, and the only bucket the
            build key below can read. Null until the first upload provisions it
            ({@see \App\Service\Bundle\ApplicationBuildBucketProvisioner}); every
            application predating #996 looks like that too, and provisions on its next
            deploy.
          nullable: true
          type: string
        buildKeyId:
          description: |-
            The access-key id of the read-only Garage key scoped to {@see $buildBucket},
            handed to build tasks. Doubles as Garage's own identifier for the key (the
            same way {@see ManagedService::$externalKeyId} does), so nothing separate is
            persisted for it.
          nullable: true
          type: string
        deployments:
          items:
            example: https://example.com/
            format: iri-reference
            type: string
          type: array
        variables:
          items:
            $ref: '#/components/schemas/Variable'
          type: array
        portAllocations:
          items:
            $ref: '#/components/schemas/PortAllocation'
          type: array
        poolDomain:
          description: |-
            Which of the app-hosting pool domains (`snarl.dev`, `starshp.dev` —
            {@see \App\Service\Ingress\DomainPoolAssigner}) this application's
            deployments answer under, in addition to `someones.computer`. Null until
            its first successful deploy assigns one, and never moved after — a
            redeploy must resolve to the same pool hostnames it already handed out,
            the same reason {@see $firstRunningAt} is a latch rather than a rolling
            value.
          nullable: true
          readOnly: true
          type: string
        poolLabel:
          description: |-
            Overrides the auto-slugified application name in the pool-domain
            hostname's `{service}.{deployment}.{label}.{poolDomain}` shape
            ({@see \App\Service\Ingress\PoolHostname}) — null for every application
            that has not opted into a custom one, which is what {@see poolLabelOrSlug()}
            falls back to. Unique platform-wide, the same reasoning as
            {@see \App\Entity\Domain::$name}: two applications sharing a label would
            collide on the exact same DNS name the moment they also shared a
            deployment and service name.
          nullable: true
          type: string
        id:
          format: uuid
          readOnly: true
          type: string
        deletedAt:
          format: date-time
          nullable: true
          readOnly: true
          type: string
        createdAt:
          format: date-time
          readOnly: true
          type: string
        updatedAt:
          format: date-time
          nullable: true
          readOnly: true
          type: string
        buildCredential:
          $ref: '#/components/schemas/SealedSecret'
        accessGateCredential:
          $ref: '#/components/schemas/SealedSecret'
        icon:
          description: "Point the application at a stored icon, or at none."
          nullable: true
          type: string
          writeOnly: true
        operatorChosenIcon:
          description: |-
            Whether the stored icon was chosen by a person, and so must survive the next
            deploy's favicon extraction.
          readOnly: true
          type: boolean
        iconVersion:
          description: |-
            A short, stable token for the icon a caller is looking at — the cache-busting
            half of the icon URL, and null when there is nothing stored to bust.
          nullable: true
          readOnly: true
          type: string
        deleted:
          readOnly: true
          type: boolean
    AdoptionApproval:
      description: |-
        A human's decision on one compose service the adoption planner detected —
        approve it, or decline it (§15).

        **The switch arms detection; this is what authorizes the act.**
        {@see \App\Service\ManagedService\Adoption\AdoptionReconciler} only ever turns a
        candidate into a real {@see ManagedService}/{@see ServiceBinding} pair when a row
        here says `approved`, and only for the compose service name recorded — a rename
        is a different candidate with no decision of its own yet.

        **There is no "pending" row.** A service the planner reports and nobody has
        decided on simply has none here; recording one for every candidate on every
        deploy would need cleaning up the moment a service is renamed away, for a state
        ("undecided") a missing row already expresses for free.

        One row per (application, compose service): deciding again — approving after a
        rejection, or the reverse — updates it rather than accumulating history, because
        only the current decision governs what the next deploy does.
      example:
        composeServiceName: composeServiceName
        approved: true
        application: https://example.com/
        decidedAt: 2000-01-23T04:56:07.000+00:00
        id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
      properties:
        application:
          example: https://example.com/
          format: iri-reference
          type: string
        composeServiceName:
          description: The compose service name this decision is about — joined against
            a live plan by name.
          type: string
        approved:
          type: boolean
        decidedAt:
          format: date-time
          nullable: true
          type: string
        id:
          format: uuid
          readOnly: true
          type: string
    AdoptionApproval.AdoptionApprovalInput:
      description: |-
        A human's decision on one compose service the adoption planner detected —
        approve it, or decline it (§15).

        **The switch arms detection; this is what authorizes the act.**
        {@see \App\Service\ManagedService\Adoption\AdoptionReconciler} only ever turns a
        candidate into a real {@see ManagedService}/{@see ServiceBinding} pair when a row
        here says `approved`, and only for the compose service name recorded — a rename
        is a different candidate with no decision of its own yet.

        **There is no "pending" row.** A service the planner reports and nobody has
        decided on simply has none here; recording one for every candidate on every
        deploy would need cleaning up the moment a service is renamed away, for a state
        ("undecided") a missing row already expresses for free.

        One row per (application, compose service): deciding again — approving after a
        rejection, or the reverse — updates it rather than accumulating history, because
        only the current decision governs what the next deploy does.
      properties:
        application:
          example: https://example.com/
          format: iri-reference
          nullable: true
          type: string
        composeServiceName:
          default: ""
          type: string
        approved:
          default: false
          type: boolean
      required:
      - application
      - composeServiceName
