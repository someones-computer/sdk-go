    ServiceBinding:
      description: |-
        That an application may use a managed service — the join the per-application
        toggle could not express.

        Many-to-many by construction: one database can back a web app and its worker,
        and one application can hold several bindings. Unbinding leaves the data alone;
        only destroying the {@see ManagedService} touches it.

        A binding is also where the *deployment* seam lives. It records which variable
        names it injects, so the UI can say what an application will receive before it
        receives it, and so the resolver can show an operator-set variable shadowing a
        binding rather than silently losing to it.

        **Creating one is a permission, not a provisioning step** — nothing at the engine
        moves. Deleting one withdraws that permission and touches no data, which is why
        `DELETE` here is a hard delete and `DELETE` on a {@see ManagedService} is not the
        same kind of verb at all.
      example:
        createdAt: 2000-01-23T04:56:07.000+00:00
        adoptedComposeService: adoptedComposeService
        application: https://example.com/
        sidecarCredential:
          ciphertext: ciphertext
          keyId: keyId
          nonce: nonce
          algo: algo
        service: https://example.com/
        injectedKeys:
        - injectedKeys
        - injectedKeys
        id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        adopted: true
        sidecarServiceName: db
        updatedAt: 2000-01-23T04:56:07.000+00:00
      properties:
        application:
          example: https://example.com/
          format: iri-reference
          type: string
        service:
          example: https://example.com/
          format: iri-reference
          type: string
        injectedKeys:
          description: |-
            The environment variable names this binding contributes — one
            `DATABASE_URL` for a database, the four `S3_*` names for a bucket.
          items:
            type: string
          type: array
        sidecarServiceName:
          default: db
          description: |-
            What the sidecar is called inside the tenant's stack — `db` unless something
            else claimed the name first.
          type: string
        adoptedComposeService:
          description: |-
            The compose service this binding replaced, or null for a binding somebody
            asked for directly.
          nullable: true
          type: string
        id:
          format: uuid
          readOnly: true
          type: string
        createdAt:
          format: date-time
          readOnly: true
          type: string
        updatedAt:
          format: date-time
          nullable: true
          readOnly: true
          type: string
        adopted:
          readOnly: true
          type: boolean
        sidecarCredential:
