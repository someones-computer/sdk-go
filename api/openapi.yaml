openapi: 3.1.0
info:
  description: "JSON-LD resources backing the control panel. Bearer-token reachable\
    \ since #1418 — see docs/sdk-generation.md."
  title: someones.computer API
  version: 1.0.0
servers:
- description: ""
  url: /
security:
- bearerAuth: []
tags:
- description: |-
    A human's decision on one compose service the adoption planner detected —
    approve it, or decline it (§15).

    **The switch arms detection; this is what authorizes the act.**
    {@see \App\Service\ManagedService\Adoption\AdoptionReconciler} only ever turns a
    candidate into a real {@see ManagedService}/{@see ServiceBinding} pair when a row
    here says `approved`, and only for the compose service name recorded — a rename
    is a different candidate with no decision of its own yet.

    **There is no "pending" row.** A service the planner reports and nobody has
    decided on simply has none here; recording one for every candidate on every
    deploy would need cleaning up the moment a service is renamed away, for a state
    ("undecided") a missing row already expresses for free.

    One row per (application, compose service): deciding again — approving after a
    rejection, or the reverse — updates it rather than accumulating history, because
    only the current decision governs what the next deploy does.
  name: AdoptionApproval
- description: |-
    A deployable "island": one logical app, defined by a compose file, deployed as a
    swarm stack. Holds a pointer to the current (immutable) deployment; history lives
    in the deployment revisions.
  name: Application
- description: |-
    An IMMUTABLE, append-only ledger row for an Organization's shared credit
    balance. A balance is never mutated in place — it's always
    `SUM(amountCents)` over `Succeeded` rows (see
    {@see CreditTransactionRepository::balanceForOrganization()}). Read-only over
    the API: money movement stays server-driven.

    Three kinds of row, one table ({@see CreditTransactionType}):

      - a **top-up** is created `Pending` before redirecting to Stripe Checkout,
        keyed on `stripeCheckoutSessionId`, then flipped to `Succeeded`/`Failed`
        by {@see \App\Controller\StripeWebhookController};
      - a **grant** and a **debit** are terminal the moment they are written, so
        both are written `Succeeded` — the `Pending` default is a Stripe-webhook
        state and is wrong for them — and neither has a Stripe session, which is
        why `stripeCheckoutSessionId` is nullable.

    A debit additionally carries the hour it bills for and the meter reading it
    came from, so the ledger can be checked against the usage events rather than
    taken on trust. One table rather than two because the balance has to be the
    sum of money in and money out, and a second table would make every balance
    read a join.
  name: CreditTransaction
- description: |-
    An IMMUTABLE compose revision. A deploy is a new row; rollback re-points
    Application::$currentDeployment at an older one. Placement is resolved onto this
    row (targetSwarm) at deploy time, so migration is just the next revision.
  name: Deployment
- description: |-
    One tenant's database or bucket on a shared engine.

    **Owned by an organization and bound to applications** — not a per-application
    toggle. The distinction is the whole reason this entity exists in this shape: a
    toggle with a unique foreign key cannot express one database backing both a web
    app and its worker, and cannot survive an application being rebuilt under a new
    name. Binding is therefore explicit ({@see ServiceBinding}), which costs one
    step at creation and buys sharing, one billing shape, one permission model and
    one set of verbs across databases *and* buckets.

    A bucket is the same noun with a different {@see $kind}. Only the driver that
    executes the tenancy operations differs.

    Soft-deleted, so a destroy is recoverable within its grace period
    ({@see ManagedServiceRepository::GRACE_PERIOD}); only the driver's `DROP` is not,
    and that runs on the far side of it.

    **Read is scoped by membership and writing by role**, which are different
    questions: {@see \App\ApiResource\ManagedServiceOwnerExtension} filters the
    query, so another tenant's id answers 404 rather than confirming it exists, while
    {@see \App\Security\Voter\ManageVoter} governs the verbs inside each processor
    — a plain member may see their organization's databases without being able to
    destroy one.

    Delete does *not* fall through to the generic soft-delete processor: dropping a
    database is not stamping a column, and the difference is a tenant's data. See
    {@see \App\State\ManagedServiceDestroyProcessor}.
  name: ManagedService
- description: "Ownership and (future) billing boundary. Owns applications, may own\
    \ BYO swarms."
  name: Organization
- description: |-
    That an application may use a managed service — the join the per-application
    toggle could not express.

    Many-to-many by construction: one database can back a web app and its worker,
    and one application can hold several bindings. Unbinding leaves the data alone;
    only destroying the {@see ManagedService} touches it.

    A binding is also where the *deployment* seam lives. It records which variable
    names it injects, so the UI can say what an application will receive before it
    receives it, and so the resolver can show an operator-set variable shadowing a
    binding rather than silently losing to it.

    **Creating one is a permission, not a provisioning step** — nothing at the engine
    moves. Deleting one withdraws that permission and touches no data, which is why
    `DELETE` here is a hard delete and `DELETE` on a {@see ManagedService} is not the
    same kind of verb at all.
  name: ServiceBinding
- description: |-
    A Docker Swarm we can deploy onto. The trust boundary of the platform.

    owner === null  => PLATFORM pool (shared infra we run).
    owner !== null  => CUSTOMER BYO cluster (untrusted, outbound-only).
  name: Swarm
