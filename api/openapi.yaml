      properties:
        application:
          example: https://example.com/
          format: iri-reference
          type: string
        sequence:
          description: Monotonic per-application revision number.
          type: integer
        name:
          description: |-
            What this revision is called — `sc` defaults it to the slugified branch,
            so the normal shape is a deployment per branch. Null for revisions created
            before the field existed, or by a client that doesn't send one.
          nullable: true
          type: string
        rawCompose:
          description: Exactly what the user submitted.
          type: string
        canonicalSpec:
          additionalProperties:
            $ref: '#/components/schemas/Deployment_jsonMergePatch_canonicalSpec_value'
          description: |-
            Parsed, supported-subset-only canonical representation — what
            {@see \App\Service\Compose\ComposeParser::parse()} produced. Both keys are
            optional here and not there: a row is whatever was written when it was
            written, so a revision that predates a key still has to load.
        buildContexts:
          additionalProperties:
            additionalProperties:
              $ref: '#/components/schemas/Deployment_jsonMergePatch_buildContexts_value_value'
          description: |-
            Build contexts uploaded with this revision, keyed by compose service name:
            `{ contextSha256, dockerfile, dockerfileContent?, additionalContexts?, image?, log? }`. The
            tarballs themselves live in the content-addressed bundle cache
            ({@see \App\Service\Bundle\BundleStorage}); this is the pointer the build
            worker will walk. `dockerfileContent` is a best-effort text preview
            extracted at ingest ({@see \App\Service\Bundle\ContextDockerfileReader}) — null
            when the context was too large to preview or predates this field.
        forwardedImages:
          additionalProperties:
            additionalProperties:
              nullable: true
              type: string
          description: |-
            Client-forwarded images uploaded with this revision, keyed by compose
            service name: `{ contextSha256, originalImage, image?, log? }`. See
            docs/registry.md's "Client-side forwarding" callout: `sc` detects a
            private, unbuildable `image:` reference it can already reach locally
            and offers to upload it, for a platform that has no other way to pull
            it. A sibling to {@see self::$buildContexts} rather than folded into
            it — that array means "run this through BuildKit", and this one never
            does. The tarballs live in the object store
            ({@see \App\Service\Bundle\ImageStorage}), not the database; `image`
            is filled in once the loader has pushed it to the internal registry,
            the same way `buildContexts[]['image']` is. `{}` for every revision
            that forwarded nothing, which is most of them.
        buildSecrets:
          additionalProperties:
            additionalProperties:
              additionalProperties:
                type: string
          description: |-
            `build.secrets` values declared for this revision's build services
            (Grey.ooo/someones.computer_agent#46), sealed the moment they arrive
            ({@see \App\Service\Secret\SecretBox}) and never written to the object
            store the way a build context is: unlike a context tarball, a build
            secret is live tenant credential material, not something worth caching
            by content — closer to how {@see \App\Service\Registry\RegistryTokenSigner}
            mints a push token than to how {@see \App\Entity\Variable} keeps one.
        targetSwarm:
          description: Resolved by the placement engine; null until placed.
          example: https://example.com/
          format: iri-reference
          nullable: true
          type: string
        status:
          default: pending
          enum:
          - pending
          - building
          - built
          - deploying
          - running
          - failed
          - rolled_back
          - quarantined
          - cancelled
          type: string
        statusReason:
          description: |-
            Why the revision is in its current status — the build worker's failure
            message, typically. Null whenever there is nothing to explain.
          nullable: true
          type: string
        failedOnSwarm:
          default: false
          description: |-
            Set on a `Failed` revision that had already created or updated at least
            one service on `$targetSwarm` before the failure — a live half-stack,
            not "nothing happened" (#1270). {@see self::isOnASwarm()} reads this
            for exactly the revisions the ordinary `Deploying`/`Running` check
            cannot see: whatever partially landed still has to be reachable to a
            manual Teardown and countable by the stray-container sweep, which is
            why every other status leaves this false rather than tracking it.
          type: boolean
        zeroTaskObservedAt:
          description: |-
            When {@see \App\Service\Reconcile\RevisionDegradationDetector} first
            found this `Running` revision with no task actually running on its
            swarm — null while at least one is, or before it was ever checked.
          format: date-time
          nullable: true
          type: string
        degraded:
          default: false
          description: |-
            Set once a `Running` revision has gone a full grace period with zero
            tasks actually running on its swarm (#1279) — a {@see Failure} of
            {@see \App\Enum\FailurePhase::Runtime} is recorded alongside it. Never
            flips `$status` itself: `running` still means "this is what the
            application should be serving", and a revision the platform cannot
            reach a running task for is a fact about the swarm, not a new desired
            state — the same desired/observed separation
            {@see \App\Service\Reconcile\DriftDetector} already keeps at read
            time, made durable here so it survives past one page view.
          type: boolean
        digest:
          description: "Content digest of the canonical spec, for dedupe/audit."
          nullable: true
          type: string
        createdBy:
          $ref: '#/components/schemas/User'
        services:
          items:
            $ref: '#/components/schemas/Service'
          type: array
        variables:
          items:
            $ref: '#/components/schemas/DeploymentVariable'
          type: array
        failures:
          items:
            $ref: '#/components/schemas/Failure'
          type: array
        id:
          format: uuid
          readOnly: true
          type: string
        deletedAt:
          format: date-time
          nullable: true
          readOnly: true
          type: string
        createdAt:
          format: date-time
          readOnly: true
          type: string
        updatedAt:
          format: date-time
          nullable: true
          readOnly: true
          type: string
        onASwarm:
          description: Whether this revision has a stack of its own on a swarm right
            now.
          readOnly: true
          type: boolean
        deleted:
          readOnly: true
          type: boolean
    Deployment.BundleUploadConfirmInput:
      description: |-
        An IMMUTABLE compose revision. A deploy is a new row; rollback re-points
        Application::$currentDeployment at an older one. Placement is resolved onto this
        row (targetSwarm) at deploy time, so migration is just the next revision.
      properties:
        secrets:
          additionalProperties:
            additionalProperties:
              type: string
          description: |-
            Raw `build.secrets` values, keyed by service then by BuildKit secret id
            (Grey.ooo/someones.computer_agent#46) — matches
            `App\Service\Bundle\BundleIngestor::commitFromStoredContent()`'s
            `$secrets` parameter.
        application:
          example: https://example.com/
          format: iri-reference
          nullable: true
          type: string
        client:
          default: api
          description: Matches `App\Service\Bundle\BundleManifest::$client` — which
            client produced this.
          type: string
        name:
          maxLength: 63
          nullable: true
          type: string
        force:
          default: false
          description: |-
            Ask for a new revision even if this digest already matches one —
            {@see BundleManifest::$force}'s own meaning, unchanged.
          type: boolean
        compose:
          default: ""
          type: string
        contexts:
          items:
            $ref: '#/components/schemas/BundleContextInput'
          type: array
        images:
          items:
            $ref: '#/components/schemas/BundleForwardedImageInput'
          type: array
      required:
      - application
      - client
      - compose
    BundleForwardedImageInput:
      properties:
        service:
          default: ""
          type: string
        image:
          default: ""
          type: string
        contextSha256:
          default: ""
          pattern: "^([a-f0-9]{64})$"
          type: string
      required:
      - contextSha256
      - image
      - service
    BundleContextInput:
      properties:
        service:
          default: ""
          type: string
        contextSha256:
          default: ""
          pattern: "^([a-f0-9]{64})$"
          type: string
        dockerfile:
          default: Dockerfile
          type: string
        additionalContexts:
          items:
            $ref: '#/components/schemas/BundleAdditionalContextInput'
          type: array
      required:
      - contextSha256
      - service
    BundleAdditionalContextInput:
      properties:
        name:
          default: ""
          type: string
        contextSha256:
          default: ""
          pattern: "^([a-f0-9]{64})$"
          type: string
      required:
      - contextSha256
      - name
    Deployment.BundleUploadConfirmOutput:
      description: |-
        An IMMUTABLE compose revision. A deploy is a new row; rollback re-points
        Application::$currentDeployment at an older one. Placement is resolved onto this
        row (targetSwarm) at deploy time, so migration is just the next revision.
      example:
        retried: true
        sequence: 0
        digest: digest
        warning: warning
        id: id
        url: url
        status: status
      properties:
        id:
          type: string
        sequence:
          type: integer
        status:
          type: string
        digest:
          nullable: true
          type: string
        url:
          type: string
        retried:
          description: True when this upload restarted an existing failed revision
            rather than minting one.
          type: boolean
        warning:
          description: "A deploy this organization can still afford, but is projected\
            \ to run out of paying for soon — null on every ordinary deploy."
          nullable: true
          type: string
