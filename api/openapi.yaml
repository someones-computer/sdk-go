      properties:
        email:
          type: string
        username:
          description: Handle the user can sign in with instead of their email.
          type: string
        displayName:
          nullable: true
          type: string
        theme:
          description: |-
            Which skin this person prefers, or null to take whatever their organization
            or the instance says.
          enum:
          - house
          - corporate
          - dull
          - plain
          - red-label
          - null
          nullable: true
          type: string
        locale:
          description: |-
            Which locale this person prefers, or null for no explicit choice — the
            same shape as {@see self::$theme}: null is not `en_GB`, it is "let the
            cascade decide" (cookie, then `Accept-Language`, then the instance
            default). See {@see \App\Service\LocaleResolver} and
            docs/internationalization.md.
          enum:
          - en_GB
          - en_US
          - null
          nullable: true
          type: string
        timezone:
          description: |-
            The IANA timezone identifier (e.g. `Europe/London`) this person prefers, or
            null for no explicit choice — the same shape as {@see self::$locale}: null
            is not UTC, it is "let the cascade decide" (cookie written by the browser's
            own auto-detection, then the instance default). A plain validated string
            rather than a backed enum like {@see self::$theme}/{@see self::$locale}: the
            IANA database has ~400 identifiers, too many for an enum to curate the way
            {@see \App\Enum\Locale} deliberately does for its two cases. See
            {@see \App\Service\TimezoneResolver}.
          nullable: true
          type: string
        password:
          description: Hashed password; null for accounts that authenticate only via
            OAuth or LDAP.
          nullable: true
          type: string
        ldapDn:
          description: |-
            The bound entry's distinguished name in LLDAP. Presence means the account
            is LDAP-authoritative: {@see App\Service\LdapAccountLinker} clears any
            local password when it sets this, and it is never set alongside one.
          nullable: true
          type: string
        avatarPhoto:
          $ref: '#/components/schemas/UserAvatarPhoto'
        roles:
          items:
            type: string
          type: array
        disabledAt:
          description: Set when a platform operator suspends the account; null = active.
          format: date-time
          nullable: true
          readOnly: true
          type: string
        spamMarkedAt:
          description: When an operator judged this account to be spam; null = not
            spam.
          format: date-time
          nullable: true
          readOnly: true
          type: string
        spamMarkedBy:
          $ref: '#/components/schemas/User'
        approvedAt:
          description: |-
            When an operator approved the account; null means it is still waiting and
            can reach nothing but the holding page ({@see self::getRoles()}).
          format: date-time
          nullable: true
          readOnly: true
          type: string
        emailConfirmedAt:
          description: |-
            When the address on this account was proven to be one the person can read;
            null means it never was ({@see \App\Service\EmailConfirmationService}).
          format: date-time
          nullable: true
          readOnly: true
          type: string
        creditGrantedAt:
          description: "When the one-off signup credit was granted ({@see \\App\\\
            Service\\Credit\\SignupGrant})."
          format: date-time
          nullable: true
          readOnly: true
          type: string
        tierPin:
          description: |-
            An operator's override of the trust tier this account would otherwise
            progress into on its own; null means the automatic rule decides
            ({@see \App\Service\Trust\TierResolver}).
          enum:
          - untrusted
          - trusted
          - verified
          - null
          nullable: true
          readOnly: true
          type: string
        tierPinnedAt:
          format: date-time
          nullable: true
          readOnly: true
          type: string
        tierPinnedBy:
          $ref: '#/components/schemas/User'
        tierPinReason:
          nullable: true
          readOnly: true
          type: string
        oauthIdentities:
          items:
            $ref: '#/components/schemas/OAuthIdentity'
          type: array
        totpSecret:
          description: |-
            The TOTP shared secret, **encrypted at rest** ({@see \App\Service\TwoFactor\TotpSecretCipher}),
            or null for an account that has not enabled a second factor.
          nullable: true
          type: string
        totpSecretKeyId:
          description: |-
            Which key wrapped {@see self::$totpSecret}, so a key rotation can re-wrap it
            without users re-enrolling ({@see \App\Service\TwoFactor\TotpSecretCipher}).
          nullable: true
          readOnly: true
          type: string
        totpConfirmedAt:
          description: |-
            When the person proved the authenticator by entering a live code; null
            means 2FA is not in force for this account. This is the flag the step-up
            gate reads ({@see \App\EventSubscriber\TwoFactorStepUpSubscriber}).
          format: date-time
          nullable: true
          readOnly: true
          type: string
        recoveryCodes:
          items:
            $ref: '#/components/schemas/RecoveryCode'
          type: array
        machineFor:
          description: "The organization this account exists to act for, or null for\
            \ a person."
          example: https://example.com/
          format: iri-reference
          nullable: true
          type: string
        id:
          format: uuid
          readOnly: true
          type: string
        deletedAt:
          format: date-time
          nullable: true
          readOnly: true
          type: string
        createdAt:
          format: date-time
          readOnly: true
          type: string
        updatedAt:
          format: date-time
          nullable: true
          readOnly: true
          type: string
        displayLabel:
          description: |-
            How this person is named in the UI. Registration requires a display name,
            but an OAuth provider may not share one, so the handle stands in — never
            the email address, which is not ours to show.
          readOnly: true
          type: string
        machine:
          description: "Whether this account is a machine acting for an organization,\
            \ not a person."
          readOnly: true
          type: boolean
        ldapManaged:
          readOnly: true
          type: boolean
        avatarPhotoType:
          nullable: true
          readOnly: true
          type: string
        userIdentifier:
          description: |-
            The identifier stored in the session token. Sign-in accepts either the
            email or the username ({@see UserRepository::loadUserByIdentifier()});
            this is the canonical one the token is refreshed from.
          readOnly: true
          type: string
        grantedRoles:
          description: |-
            The roles the account actually carries, whether or not it has been
            approved — what the admin panel shows and what the feature toggles flip.
          items:
            type: string
          type: array
        disabled:
          readOnly: true
          type: boolean
        spam:
          readOnly: true
          type: boolean
        approved:
          readOnly: true
          type: boolean
        emailConfirmed:
          readOnly: true
          type: boolean
        tierPinned:
          readOnly: true
          type: boolean
        totpEnabled:
          description: True once the person has proved the authenticator — the gate's
            on/off switch.
          readOnly: true
          type: boolean
        deleted:
          readOnly: true
          type: boolean
