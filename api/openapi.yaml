          description: |-
            The container port this service speaks HTTP on, as compose's
            `x-someones.http` declared it — null means nothing was declared and
            {@see \App\Service\Ingress\IngressPlanner} falls back to the well-known
            ports.
          nullable: true
          type: integer
        command:
          description: |-
            The container's argv, as compose `command:` declared it — already split into
            words by the parser, because Swarm's `Args` is argv rather than a line.
          items:
            type: string
          nullable: true
          type: array
        entrypoint:
          description: |-
            The container's `Command` — compose `entrypoint:`, which replaces the
            image's own `ENTRYPOINT` rather than feeding it, unlike {@see $command}.
          items:
            type: string
          nullable: true
          type: array
        healthcheck:
          additionalProperties:
            $ref: '#/components/schemas/Service_healthcheck_value'
          description: |-
            Compose `healthcheck:`, projected straight from {@see \App\Service\Compose\ComposeParser::healthcheck()}
            into the shape {@see \App\Service\Deploy\StackDeployer} sends as Swarm's
            `ContainerSpec.Healthcheck` — `test` is a `NONE`/`CMD`/`CMD-SHELL` argv,
            the rest are nanoseconds/a count. Null means nothing was declared, so an
            image's own baked-in `HEALTHCHECK` (or none) stands; `disable: true` in
            the compose file is not null, it is `test: ["NONE"]` — an explicit
            instruction rather than silence.
        restart:
          default: always
          description: What happens when a container exits; also decides service vs
            job.
          enum:
          - always
          - on-failure
          - never
          type: string
        forwardedUnscanned:
          default: false
          description: |-
            Set while this service's image arrived by client-side forwarding
            (docs/registry.md's "Client-side forwarding" callout) and no scan verdict
            is yet on record for the digest it was pinned to — bytes from a user's
            machine, not a source tree we built or a registry we chose to trust. A
            forwarded image is scanned as it loads ({@see \App\MessageHandler\BuildBundleHandler}),
            so this is normally cleared by the time the service is projected; one left
            set is a forwarded image that reached deploy unvetted, which
            {@see \App\MessageHandler\DeployRevisionHandler} refuses to run
            (docs/image-scanning.md).
          type: boolean
