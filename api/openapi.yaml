      properties:
        organization:
          example: https://example.com/
          format: iri-reference
          type: string
        type:
          enum:
          - top_up
          - grant
          - debit
          - gift_card
          type: string
        status:
          default: pending
          enum:
          - pending
          - succeeded
          - failed
          type: string
        amountCents:
          description: Signed integer amount in the smallest currency unit (cents
            for USD).
          type: integer
        currency:
          default: usd
          type: string
        stripeCheckoutSessionId:
          description: |-
            Stripe Checkout Session id; a top-up row is created Pending against this
            before redirecting. Null on a grant and on a debit, neither of which has
            a Stripe session — the *type* is what says which kind of row this is, not
            whether this column is set.
          nullable: true
          type: string
        usageHour:
          description: "The clock hour a debit bills for, truncated to the hour and\
            \ stored UTC."
          format: date-time
          nullable: true
          readOnly: true
          type: string
        resourceKind:
          description: |-
            Which meter wrote this row; null on every non-debit row. The other half
            of the unique key above, and always set on a debit — never left null the
            way a top-up or grant's `usageHour` is, or two debits from different
            meters in the same hour would stop colliding with each other but a debit
            from the *same* meter twice would also stop colliding with itself.
          enum:
          - compute
          - storage
          - engine_load
          - registry_storage
          - null
          nullable: true
          readOnly: true
          type: string
        usageSeconds:
          description: Resolved container-seconds this debit was computed from; null
            on anything but a compute debit.
          nullable: true
          readOnly: true
          type: integer
        unresolvedContainers:
          description: Containers the meter saw start and never saw stop over the
            billed hour.
          nullable: true
          readOnly: true
          type: integer
        usageBytes:
          $ref: '#/components/schemas/CreditTransaction_usageBytes'
        engineMillis:
          $ref: '#/components/schemas/CreditTransaction_engineMillis'
        stripeEventId:
          description: Stripe Event id that last transitioned this row; secondary
            idempotency guard for webhook delivery.
          nullable: true
          type: string
        createdBy:
          $ref: '#/components/schemas/User'
        id:
          format: uuid
          readOnly: true
          type: string
        createdAt:
          format: date-time
          readOnly: true
          type: string
        updatedAt:
          format: date-time
          nullable: true
          readOnly: true
          type: string
