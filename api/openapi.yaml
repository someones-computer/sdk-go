      properties:
        machineAccount:
          $ref: '#/components/schemas/User'
        name:
          type: string
        slug:
          description: |-
            `unique: true` stops two organizations holding the same *string*; the
            constraint stops two holding strings that fold to the same **stack name**,
            which the database has no way to express (#860). Both are needed: the
            column guards the identifier, the constraint guards what is derived from it.
          type: string
        theme:
          description: "The skin this organization's members see, or null to take\
            \ the instance's."
          enum:
          - house
          - corporate
          - dull
          - plain
          - red-label
          - null
          nullable: true
          type: string
        tierPin:
          description: |-
            An operator's grant of a tier this organization would not reach through
            any member — {@see \App\Enum\AccountTier::Verified} in particular, which
            is granted rather than earned and belongs to a contractual relationship
            with the *organization*, not incidentally to whichever of its members
            happens to carry the highest personal tier
            ({@see \App\Service\Trust\TierResolver::forOrganization()}). A member
            individually pinned `Verified` still lifts the org the same way a
            `Trusted` member always has — this pin is for granting it to the org
            directly, without needing a person to hang it on.
          enum:
          - untrusted
          - trusted
          - verified
          - null
          nullable: true
          readOnly: true
          type: string
        tierPinnedAt:
          format: date-time
          nullable: true
          readOnly: true
          type: string
        tierPinnedBy:
          $ref: '#/components/schemas/User'
        tierPinReason:
          nullable: true
          readOnly: true
          type: string
        lowBalanceWarnedAt:
          description: |-
            When {@see \App\MessageHandler\CheckRunwayHandler} last warned this
            organization that its projected runway had dropped below the
            threshold; null once no warning is outstanding. Set once per crossing
            and cleared the moment the projection recovers — by a top-up or by the
            burn easing off — which is what makes "warn once, re-arm on recovery"
            a fact this column can answer rather than something re-derived from
            the notification table on every tick.
          format: date-time
          nullable: true
          readOnly: true
          type: string
        twoFactorRequiredAt:
          description: |-
            When an Owner/Admin turned on the requirement that every member of this
            organization protects their account with a second factor; null means it is
            optional. A reversible policy toggle, stamped like {@see User::$disabledAt}
            rather than a verdict, so no "who set it" attribution.
          format: date-time
          nullable: true
          readOnly: true
          type: string
        memberships:
          items:
            $ref: '#/components/schemas/Membership'
          type: array
        applications:
          items:
            example: https://example.com/
            format: iri-reference
            type: string
          type: array
        swarms:
